name: Build Transpire for Apple Silicon
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vst2:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --parallel 3
      - name: Package and verify
        shell: bash
        run: |
          bundle=build/Transpire.vst
          resources="$bundle/Contents/Resources"
          mkdir -p "$resources/transpire_gfx"
          upstream=https://raw.githubusercontent.com/Sonic-Anomaly/Sonic-Anomaly-JSFX/f14cef59b86bd58c3e1e6a5bf982ff71c302443f/Plugins
          curl -fsSL "$upstream/Transpire.jsfx" -o "$resources/Transpire.jsfx"
          for image in bg clip credits knob_1 knob_2 knob_3 knob_4; do
            curl -fsSL "$upstream/transpire_gfx/$image.png" -o "$resources/transpire_gfx/$image.png"
          done
          python3 prepare_editor.py "$resources/Transpire.jsfx"
          cp build/_deps/ysfx-src/LICENSE "$resources/ysfx-LICENSE.txt"
          codesign --force --sign - "$bundle"
          codesign --verify --strict "$bundle"
          test "$(lipo -archs "$bundle/Contents/MacOS/Transpire")" = arm64
          python3 smoke.py "$bundle/Contents/MacOS/Transpire"
          xcrun clang++ -std=c++17 -fobjc-arc -framework Cocoa editor_smoke.mm -o build/editor_smoke
          build/editor_smoke "$bundle/Contents/MacOS/Transpire"
          ditto -c -k --keepParent "$bundle" Transpire-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Transpire-macOS-arm64
          path: Transpire-macOS-arm64.zip
          if-no-files-found: error
